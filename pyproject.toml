[project]
name = "advanced-memory-mcp"
version = "0.2.0"
description = "Multi-user MCP memory server with SSE/streamable HTTP support"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
]

[project.scripts]
advanced-memory-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "knowledge_graph.py", "token_config.py"]
