{% extends "base.html" %}
{% block title %}Sign in &middot; Memory MCP{% endblock %}
{% block content %}
<section class="login">
  <h1>Sign in</h1>
  <p class="hint">Paste your MCP API token to continue.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/login{% if next_url and next_url != '/ui/' %}?next={{ next_url|urlencode }}{% endif %}">
    <label for="token">Token</label>
    <input type="password" id="token" name="token" autocomplete="off" autofocus required>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
